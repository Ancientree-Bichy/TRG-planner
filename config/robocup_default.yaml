isVerbose: false
timer:
  graphRate: 5.0
  planningRate: 10.0
map:
  isPrebuiltMap: true
  # Inject this at launch time with `map_path:=...` or `mapConfigPath:=...`.
  # Keep the hyperparameters scene-independent; do not create one YAML per map.
  prebuiltMapPath: ""
  waitPoseBeforeInit: true
  isVoxelize: true
  voxelSize: 0.05
trg:
  isPrebuiltTRG: false
  prebuiltTRGPath: ""
  isUpdate: true
  expandDist: 0.42
  robotSize: 0.3
  sampleNum: 32
  randomSeed: 7
  deterministicSampling: true
  heightThreshold: 0.50
  collisionThreshold: 0.30
  updateCollisionThreshold: 0.5
  safetyFactor: 3.0
  goalTolerance: 0.3
  # native: original TRG graph A*.
  # trg_astar: migrated Path_Planing_QRC A* cost on the existing TRG graph.
  pathSearchMode: native
trgAStar:
  fallbackToNative: true
  headingBins: 8
  lengthWeight: 1.0
  riskWeight: 3.0
  climbWeight: 0.35
  slopeWeight: 0.35
  turnWeight: 0.2
  heuristicWeight: 1.0
  lengthScaleM: 0.42
  climbScaleM: 0.50
  slopeScaleTan: 0.7
  turnScale: 0.25
  maxEdgeClimbM: 0.0
  maxEdgeSlopeTan: 0.0
  # Rectangular body/footprint terms ported from Path_Planing_QRC/astar_go2w_rect.py.
  # Only used when trg.pathSearchMode is trg_astar.
  footprintCostEnabled: true
  footprintRejectInvalid: false
  robotLengthM: 0.70
  robotWidthM: 0.43
  maxBodyHeightDiffM: 0.70
  maxBodyTiltDeg: 35.0
  maxInteriorPenetrationM: 0.30
  bodyHeightWeight: 0.35
  bodyTiltWeight: 0.35
  bodyPenetrationWeight: 0.25
  bodyInvalidWeight: 4.0
  footprintSampleStepM: 0.05
  footprintEdgeBandM: 0.06
boundary:
  enabled: false
  allowedAreaPath: ""
  keepoutMargin: 0.0
